name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    container: python:3.9-bullseye
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --upgrade pip wheel && pip install -r requirements.txt
      - name: Lint with Flake8
        run: flake8 --count --max-complexity=10 --max-line-length=127 --statistics
      - name: Run unit tests
        run: nosetests -v --with-spec --spec-color